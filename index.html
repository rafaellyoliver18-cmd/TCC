<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Apoio Emocional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Bem-vindo ao Apoio Emocional</h1>
    <p>Um espaço seguro para cuidar da sua mente</p>
</header>

<section class="card">
    <h2>Como você está se sentindo hoje?</h2>
    <textarea id="texto" placeholder="Escreva aqui..."></textarea>
    <button onclick="salvar()">Salvar</button>
</section>

<section class="card">
    <h2>Dicas de Bem-estar</h2>
    <ul>
        <li>Respire fundo por 1 minuto</li>
        <li>Evite sobrecarga mental</li>
        <li>Converse com alguém de confiança</li>
    </ul>

</section>
<script>
    function salvar() {
        let texto = document.getElementById("texto").value;
    
        if (texto.trim() === "") {
            alert("Por favor, escreva como você está se sentindo!");
            return;
        }
    
        // opcional: salvar no navegador
        localStorage.setItem("sentimento", texto);
    
        // redireciona para a página de desabafo
        window.location.href = "desabafo.html";
    }
    </script>
</body>
</html>
